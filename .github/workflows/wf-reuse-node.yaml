name: wf-reuse-node-ms-ci-cd
on:
  workflow_call:
    inputs:
      DOCKER_IMAGE_NAME:
        type: string
        required: true
      WORKING_DIR:
        type: string
        required: false
        default: "."   
      DOCKERHUB_USERNAME:
        type: string
        required: true
      NEXT_PUBLIC_API_BASE_URL:
        type: string
        required: false
        default: ""
      NEXT_PUBLIC_API_KEY:
        type: string
        required: false
        default: ""
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  node-test-app:
    runs-on: ubuntu-latest
    name: node test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - id: node-test
        name: node test
        uses: equality-tech/i27-helpdesk-devops/.github/actions/node-test@main
        with:
          WORKING_DIR: ${{inputs.WORKING_DIR}}

  docker-build-package-push-job:
    name: docker build, package and push
    runs-on: ubuntu-latest
    needs: node-test-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: docker push image
        uses: equality-tech/i27-helpdesk-devops/.github/actions/docker-build-push@main
        with:
          IMAGE_NAME: ${{inputs.DOCKER_IMAGE_NAME}}
          WORKING_DIR: ${{inputs.WORKING_DIR}}
          DOCKERHUB_USERNAME: ${{inputs.DOCKERHUB_USERNAME}}
          DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
          ADDITIONAL_ARGS: --build-arg NEXT_PUBLIC_API_BASE_URL=${{inputs.NEXT_PUBLIC_API_BASE_URL}} --build-arg NEXT_PUBLIC_API_KEY=${{inputs.NEXT_PUBLIC_API_KEY}}
