name: wf-reuse-python-ms-ci-cd
on:
  workflow_call:
    inputs:
      DOCKER_IMAGE_NAME:
        type: string
        required: true
      WORKING_DIR:
        type: string
        required: false
        default: "."       
      DOCKERHUB_USERNAME:
        type: string
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: true


jobs:
  python-test-app:
    runs-on: ubuntu-latest
    name: python app testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - id: python-test-app
        name: check out code
        uses: equality-tech/i27-helpdesk-devops/.github/actions/python-test@main
        with:
          WORKING_DIR: ${{inputs.WORKING_DIR}}

  docker-build-package-push-job:
    name: docker build, package and push
    runs-on: ubuntu-latest
    needs: python-test-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: docker push image
        uses: equality-tech/i27-helpdesk-devops/.github/actions/docker-build-push@main
        with:
          IMAGE_NAME: ${{inputs.DOCKER_IMAGE_NAME}}
          WORKING_DIR: ${{inputs.WORKING_DIR}}
          DOCKERHUB_USERNAME: ${{inputs.DOCKERHUB_USERNAME}}
          DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
